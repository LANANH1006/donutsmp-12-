name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tu tim thu muc chua build.gradle (ke ca khi ban up nguyen thu muc "donutlike/" len GitHub)
      - name: Find project directory
        id: proj
        run: |
          f=$(find . -maxdepth 3 -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then echo "Khong tim thay build.gradle"; exit 1; fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Project dir: $d"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: Collect jar
        run: |
          mkdir -p dist
          cp "${{ steps.proj.outputs.dir }}"/build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: donutlike-mod
          path: dist/*.jar
          if-no-files-found: error

      - name: Create Release (khi push tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
